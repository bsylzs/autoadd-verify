<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAdd</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0d0d0d; color:#fff; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        .container { text-align:center; max-width:560px; width:100%; }
        .logo { font-size:2.4rem; font-weight:800; background:linear-gradient(90deg,#dc143c,#9b59b6,#1e3ddb); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; letter-spacing:2px; }
        .subtitle { color:#666; font-size:0.85rem; margin-bottom:36px; }
        .card { background:#141414; border:1px solid #222; border-radius:14px; padding:28px; margin-bottom:16px; text-align:left; }
        .card-title { font-size:0.75rem; text-transform:uppercase; letter-spacing:2px; color:#9b59b6; margin-bottom:6px; }
        h2 { font-size:1.2rem; margin-bottom:8px; }
        .desc { color:#777; font-size:0.85rem; margin-bottom:22px; line-height:1.6; }
        input[type="text"] { width:100%; background:#0d0d0d; border:1px solid #2a2a2a; border-radius:8px; padding:13px 16px; color:#fff; font-size:1rem; outline:none; text-align:center; letter-spacing:1px; margin-bottom:10px; }
        input[type="text"]:focus { border-color:#9b59b6; }
        input::placeholder { color:#444; }
        .btn { background:linear-gradient(90deg,#dc143c,#9b59b6,#1e3ddb); color:#fff; border:none; border-radius:8px; padding:12px 28px; font-size:0.95rem; font-weight:700; cursor:pointer; width:100%; transition:opacity 0.2s; }
        .btn:hover { opacity:0.85; }
        .btn:disabled { opacity:0.3; cursor:not-allowed; }
        .btn.green { background:linear-gradient(90deg,#27ae60,#2ecc71); }
        .token-box { background:#0d0d0d; border:1px solid #2a2a2a; border-radius:8px; padding:16px; font-family:monospace; font-size:1.3rem; letter-spacing:3px; color:#9b59b6; margin-bottom:10px; word-break:break-all; }
        .instruction { background:#0d0d0d; border:1px solid #1e1e1e; border-radius:8px; padding:14px; font-size:0.82rem; color:#888; line-height:1.8; text-align:left; }
        .instruction code { background:#1a1a1a; color:#9b59b6; padding:2px 6px; border-radius:4px; font-family:monospace; }
        .err { color:#e74c3c; font-size:0.82rem; margin-top:8px; }
        .footer { margin-top:28px; color:#333; font-size:0.72rem; }
        .footer a { color:#9b59b6; text-decoration:none; }
        .captcha-grid { display:flex; flex-direction:column; gap:14px; }
        .cap-card { background:#141414; border:1px solid #222; border-radius:12px; padding:20px; }
        .cap-card h3 { font-size:0.9rem; color:#9b59b6; margin-bottom:4px; }
        .cap-card p { font-size:0.78rem; color:#666; margin-bottom:14px; }
        .solved-tag { color:#2ecc71; font-weight:700; font-size:0.85rem; }
        .start-bar { position:fixed; bottom:0; left:0; right:0; background:#0d0d0d; border-top:1px solid #222; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .start-bar span { color:#666; font-size:0.85rem; }
        .start-bar .btn { width:auto; padding:10px 28px; }
        .pb { padding-bottom:90px; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">AutoAdd</div>
    <div class="subtitle">discord.gg/GEZ5gVBykM</div>
    <div id="mainContent"></div>
    <div class="footer">AutoAdd &bull; <a href="https://discord.gg/GEZ5gVBykM" target="_blank">discord.gg/GEZ5gVBykM</a></div>
</div>
<div class="start-bar" id="startBar" style="display:none">
    <span id="solvedCount">0 solved</span>
    <button class="btn" id="startBtn" onclick="startNow()" disabled>Start Now</button>
</div>

<script>
const params  = new URLSearchParams(window.location.search);
const capData = params.get('data');
const idParam = params.get('id');
const isCap   = params.get('captcha') === '1' && capData;

// ── Captcha solver ────────────────────────────────────────────────────────────
if (isCap) {
    let captchas = [];
    let solved   = {};

    try { captchas = JSON.parse(decodeURIComponent(capData)); } catch(e) { console.error('Parse error', e); }

    document.getElementById('startBar').style.display = 'flex';

    // Register global callbacks BEFORE rendering so hCaptcha can find them
    captchas.forEach(c => {
        const cb = 'hcb_' + c.id.replace(/[^a-z0-9]/gi, '_');
        window[cb] = function(token) {
            solved[c.id] = token;
            // Send back to localhost via image trick (allowed from HTTPS)
            const img = new Image();
            img.src = 'http://localhost:7432/solved?d=' + encodeURIComponent(JSON.stringify({id: c.id, captcha_key: token}));
            document.getElementById('card_' + c.id.replace(/[^a-z0-9]/gi,'_')).innerHTML =
                '<h3>discord.gg/' + c.invite + '</h3><p>Token: ' + c.token_preview + '</p><span class="solved-tag">✓ Solved</span>';
            updateBtn();
        };
    });

    // Build HTML — hCaptcha will auto-render divs with class h-captcha on script load
    const mc = document.getElementById('mainContent');
    mc.className = 'pb';
    mc.innerHTML =
        '<div class="card" style="text-align:center;margin-bottom:20px;">' +
            '<div class="card-title">AutoAdd — Captcha Solver</div>' +
            '<h2 style="margin-bottom:6px;">Solve the captchas below</h2>' +
            '<p class="desc" style="margin-bottom:0">Each captcha unlocks a server join. Solve one or more then click Start.</p>' +
        '</div>' +
        '<div class="captcha-grid">' +
        captchas.map(function(c) {
            const cbName  = 'hcb_' + c.id.replace(/[^a-z0-9]/gi, '_');
            const cardId  = 'card_' + c.id.replace(/[^a-z0-9]/gi, '_');
            const rqAttr  = c.rqdata ? ' data-rqdata="' + c.rqdata + '"' : '';
            return '<div class="cap-card" id="' + cardId + '">' +
                '<h3>discord.gg/' + c.invite + '</h3>' +
                '<p>Token: ' + c.token_preview + '</p>' +
                '<div class="h-captcha"' +
                    ' data-sitekey="' + c.sitekey + '"' +
                    rqAttr +
                    ' data-callback="' + cbName + '"' +
                    ' data-theme="dark">' +
                '</div>' +
            '</div>';
        }).join('') +
        '</div>';

    // Load hCaptcha AFTER the divs are in the DOM so it auto-renders them
    var script = document.createElement('script');
    script.src = 'https://js.hcaptcha.com/1/api.js';
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);

    function updateBtn() {
        const n = Object.keys(solved).length;
        document.getElementById('solvedCount').textContent = n + ' of ' + captchas.length + ' solved';
        document.getElementById('startBtn').disabled = n === 0;
        document.getElementById('startBtn').textContent = n > 0 ? 'Start Now (' + n + ' ready)' : 'Start Now';
    }

    function startNow() {
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').textContent = '✓ Done';
        document.getElementById('solvedCount').textContent = 'Paste each key into your terminal, then press Enter.';
    }

    updateBtn();

// ── Key verification ──────────────────────────────────────────────────────────
} else {
    document.getElementById('mainContent').innerHTML =
        '<div class="card" id="step1">' +
            '<div class="card-title">Step 1 of 2</div>' +
            '<h2>Enter Your Discord ID</h2>' +
            '<p class="desc">Right-click your name → <strong>Copy User ID</strong><br>Need Developer Mode? Settings → Advanced → Developer Mode</p>' +
            '<input type="text" id="discordInput" placeholder="e.g. 123456789012345678" maxlength="20" />' +
            '<div id="idError" class="err"></div>' +
            '<button class="btn" onclick="generateToken()">Generate My Token</button>' +
        '</div>' +
        '<div class="card" id="step2" style="display:none">' +
            '<div class="card-title">Step 2 of 2</div>' +
            '<h2>Your Verification Token</h2>' +
            '<p class="desc">Copy and paste this in <strong>#get-key</strong> on Discord.</p>' +
            '<div class="token-box" id="tokenDisplay"></div>' +
            '<button class="btn green" id="copyBtn" onclick="copyToken()">Copy Token</button>' +
            '<br><br>' +
            '<div class="instruction">' +
                '1. Go to <strong>#get-key</strong> in our Discord<br>' +
                '2. Send: <code id="verifyCmd"></code><br>' +
                '3. Bot will DM your key 🎉' +
            '</div>' +
        '</div>';

    if (idParam && /^\d{17,20}$/.test(idParam)) {
        document.getElementById('discordInput').value = idParam;
        generateToken();
    }

    // Load hCaptcha is NOT needed on key page
}

function generateToken() {
    var input = document.getElementById('discordInput').value.trim();
    var err   = document.getElementById('idError');
    if (!/^\d{17,20}$/.test(input)) { err.textContent = '❌ Invalid Discord ID.'; return; }
    err.textContent = '';
    var token = computeToken(input);
    document.getElementById('tokenDisplay').textContent = token;
    document.getElementById('verifyCmd').textContent = '!verify ' + token;
    document.getElementById('step2').style.display = 'block';
}

function computeToken(id) {
    var win = Math.floor(Date.now() / 1000 / 600);
    return btoa(id + ':' + win + ':autoadd').replace(/[^a-zA-Z0-9]/g,'').substring(0,20).toUpperCase();
}

function copyToken() {
    var t = document.getElementById('tokenDisplay').textContent;
    navigator.clipboard.writeText('!verify ' + t).then(function() {
        var btn = document.getElementById('copyBtn');
        btn.textContent = '✓ Copied!';
        setTimeout(function(){ btn.textContent = 'Copy Token'; }, 3000);
    });
}
</script>
</body>
</html>
