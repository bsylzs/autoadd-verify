<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAdd - Verify</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
            width: 90%;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #9B59B6, #5865F2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 32px;
        }

        .step {
            color: #9B59B6;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .desc {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .token-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 18px 24px;
            font-size: 1.5rem;
            font-family: monospace;
            letter-spacing: 4px;
            color: #9B59B6;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .copy-btn {
            background: linear-gradient(90deg, #9B59B6, #5865F2);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: opacity 0.2s;
        }

        .copy-btn:hover { opacity: 0.85; }
        .copy-btn:active { opacity: 0.7; }

        .instruction {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: left;
            line-height: 1.7;
        }

        .instruction code {
            background: #222;
            color: #9B59B6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .footer {
            margin-top: 24px;
            color: #555;
            font-size: 0.75rem;
        }

        .footer a {
            color: #9B59B6;
            text-decoration: none;
        }

        .copied {
            background: linear-gradient(90deg, #27ae60, #2ecc71) !important;
        }

        #loading {
            color: #888;
            font-size: 0.9rem;
        }

        .error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AutoAdd</div>
        <div class="subtitle">discord.gg/GEZ5gVBykM</div>

        <div class="card">
            <div class="step">Step 1 complete</div>
            <h2>Your Verification Token</h2>
            <p class="desc">
                Copy the token below and paste it in the <strong>#get-key</strong> channel in our Discord using <code>!verify &lt;token&gt;</code>
            </p>

            <div id="content">
                <div id="loading">Generating your token...</div>
            </div>
        </div>

        <div class="footer">
            AutoAdd &bull; <a href="https://discord.gg/GEZ5gVBykM" target="_blank">discord.gg/GEZ5gVBykM</a>
        </div>
    </div>

    <script>
        // Get discord_id from URL param e.g. ?id=123456789
        const params = new URLSearchParams(window.location.search);
        const discordId = params.get('id');

        function generateToken(discordId) {
            // Simple token: base64(discordId + timestamp_window) 
            // Timestamp window = current 10-minute block so token is valid for up to 10 mins
            const window = Math.floor(Date.now() / 1000 / 600);
            const raw = discordId + ':' + window + ':autoadd';
            // Encode to base64 and take first 24 chars, uppercase
            const token = btoa(raw).replace(/[^a-zA-Z0-9]/g, '').substring(0, 20).toUpperCase();
            return token;
        }

        function render() {
            const content = document.getElementById('content');

            if (!discordId) {
                content.innerHTML = `
                    <div class="error">
                        ❌ Invalid link. Please run <code>!getkey</code> in our Discord to get a valid link.
                    </div>`;
                return;
            }

            const token = generateToken(discordId);

            content.innerHTML = `
                <div class="token-box" id="token">${token}</div>
                <button class="copy-btn" id="copyBtn" onclick="copyToken('${token}')">
                    Copy Token
                </button>
                <div class="instruction">
                    1. Go to <strong>#get-key</strong> in our Discord<br>
                    2. Send: <code>!verify ${token}</code><br>
                    3. The bot will DM you your key
                </div>`;
        }

        function copyToken(token) {
            navigator.clipboard.writeText('!verify ' + token).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✓ Copied! Paste in Discord';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Token';
                    btn.classList.remove('copied');
                }, 3000);
            });
        }

        render();
    </script>
</body>
</html>
